version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: agrosmart_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: agrosmart_ai
    volumes:
      - mongo_data:/data/db

  ml-service:
    build:
      context: ./services/ml
      dockerfile: ../../infrastructure/docker/Dockerfile.ml
    container_name: agrosmart_ml_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./services/ml/models:/app/models

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: agrosmart_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ml-service
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/agrosmart_ai
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-agrosmart_super_secure_jwt_access_secret_key_minimum_32_characters_long_12345}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-agrosmart_super_secure_jwt_refresh_secret_key_minimum_32_characters_long_67890}
      - CLIENT_ORIGIN=http://localhost:5173
      - ML_SERVICE_URL=http://ml-service:8000
      - WEATHER_PROVIDER=open-meteo
      - MANDI_API_PROVIDER=fallback_curated
      - LLM_PROVIDER=${LLM_PROVIDER:-mock_fallback}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - api_uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: agrosmart_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1

volumes:
  mongo_data:
  api_uploads:
